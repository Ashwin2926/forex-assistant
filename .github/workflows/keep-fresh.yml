name: Keep candle data fresh

# Replaces the in-process APScheduler job that used to run inside the FastAPI Cloud
# app (see app/main.py history). That approach silently stopped working whenever the
# instance scaled to zero between requests — the scheduler dies with the process and
# only resumes on the next cold start, so candle data could go stale for days without
# any error being raised. Driving ingestion from here instead means it runs on a
# schedule GitHub controls, independent of whether the backend instance is asleep.
#
# Four cron entries instead of one "*/15 refresh everything" — a 4h candle only closes
# every 4 hours and a 1day candle once a day, so refreshing them on the same 15-minute
# cadence as 5min/15min was pure waste: 5 intervals x 4 pairs x 96 runs/day = 1,920
# Twelve Data calls/day, well over the free tier's 800/day cap. Splitting by how often
# each interval's underlying candle actually advances, plus running the fast tier every
# 20 min instead of 15, brings this down to ~700/day (5min+15min: 576, 1h: 96, 4h: 24,
# 1day: 4) — comfortably under the cap while keeping the fastest possible refresh for
# 5min/15min, the two intervals whose signal quality depends on it most. Each entry is
# minute-offset from the others so they don't collide on the same wall-clock minute.
# Which intervals a run actually handles no longer depends on which entry fired -- see the
# "Decide which intervals are due" step; the extra entries now just give GitHub's lossy
# scheduler more chances to start a run at all.
#
# All five intervals run the same validated RuleConfig now (see
# signal_engine.PROFILE_DEFAULTS["intraday"]) -- the separate "swing" profile that used
# to run on 1h/4h/1day was removed (see PROGRESS.md), and this workflow's own 1h/4h/1day
# steps had been temporarily disabled as part of that same change, then restored across
# all 5 intervals. The rule engine's own /signals/.../intraday generate step and
# /signals/score were removed entirely as part of the SMC-only migration (see
# PROGRESS.md's rule-engine-removal entry) -- consensus (SMC) and RL are the only live
# signal sources now, both already covered by their own steps below.
on:
  schedule:
    - cron: "*/20 * * * *"  # 5min + 15min candles
    - cron: "3 * * * *"     # + 1h candles, hourly
    - cron: "7 */4 * * *"   # + 4h candles, every 4 hours
    - cron: "11 0 * * *"    # + 1day candles, once daily at 00:11 UTC
  workflow_dispatch: {}

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://forex-assistant.fastapicloud.dev
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      # /rl/signal calls below retry up to twice (40s apart) on 502/503/no-response: when the
      # FastAPI Cloud replica dies mid-request (seen repeatedly 2026-09-26, silent restart, no
      # traceback) every following call 502s instantly for ~70s while it reboots, which used
      # to throw away the rest of that interval's batch. A 524 (request hung past the gateway)
      # is NOT retried -- that request itself is what's killing the replica.
      # One-line summary of a POST /rl/signal response, so the job log says WHY no signal was
      # stored (HOLD, excluded policy, ML gate, memory gate, 4xx detail, gateway timeout)
      # instead of discarding the body -- the old `-o /dev/null` made every one of those
      # outcomes look identical to a healthy run.
      RL_SUMMARIZE: |
        import json, sys
        raw = sys.stdin.read()
        try:
            d = json.loads(raw)
        except Exception:
            print("non-JSON body:", raw[:200].replace("\n", " ") or "<empty>")
            sys.exit()
        s = d.get("signal")
        if s:
            print("SIGNAL", s.get("direction"), s.get("size_tier"), "status=" + str(s.get("status")), s.get("timestamp"))
        else:
            print("no signal:", d.get("excluded_reason") or d.get("ml_blocked_reason")
                  or d.get("memory_override") or d.get("detail") or ("HOLD/EXIT q=" + json.dumps(d.get("q_values"))))
    steps:
      # Every route except / and /auth/login requires auth (see app/core/auth.py). This
      # workflow can't do an interactive login, so it authenticates with a static
      # X-Service-Token instead of a user JWT — same value must be set as AUTH_SECRET_KEY2
      # on FastAPI Cloud (named to match what's already there, not related to the JWT
      # signing key AUTH_SECRET_KEY despite the similar name). The secret is named
      # AUTOMATION_TOKEN here on the GitHub side; only the value has to match, not the name.
      # Decides which intervals this run handles, from GET /ingest/due (DB-only, no Twelve
      # Data credits): an interval is due once a new bar should exist that hasn't been fetched
      # since its last /ingest attempt -- see data_fetcher.interval_due. This replaced gating
      # each interval on which cron entry fired (github.event.schedule): GitHub delivered only
      # ~17 of ~103 scheduled firings/day on 2026-09-27/28, so whenever the one entry meant
      # for 1h/4h/1day was dropped, that interval simply wasn't checked until its next slot
      # (the 1day check could miss a whole day). Now ANY run picks up whatever is due. Each
      # interval is fetched at most once per bar however many runs arrive, which is what keeps
      # Twelve Data usage bounded (~700/day even if every firing were delivered). Manual
      # (workflow_dispatch) runs still do everything. If the due check itself fails, every
      # interval is treated as due -- a missed check is worse than a few extra credits.
      - name: Decide which intervals are due
        run: |
          set_all_due() { for i in 5MIN 15MIN 1H 4H 1DAY; do echo "DUE_$i=true" >> "$GITHUB_ENV"; done; }
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "$GITHUB_EVENT_NAME run -- all intervals"; set_all_due; exit 0
          fi
          if ! resp=$(curl -sf -m 60 -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/due"); then
            echo "::warning::GET /ingest/due failed -- treating every interval as due"; set_all_due; exit 0
          fi
          echo "$resp" | python3 -c "
          import json, os, sys
          d = json.load(sys.stdin)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for interval in ('5min', '15min', '1h', '4h', '1day'):
                  info = d.get(interval) or {'due': True, 'reason': 'missing from /ingest/due response'}
                  print(f\"{interval:5} {'DUE ' if info['due'] else 'skip'}  {info['reason']}\")
                  env.write(f\"DUE_{interval.upper()}={'true' if info['due'] else 'false'}\\n\")"
      - name: Ingest 5min + 15min candles
        if: env.DUE_5MIN == 'true' || env.DUE_15MIN == 'true'
        run: |
          for interval in 5min 15min; do
            v=DUE_${interval^^}; if [ "${!v}" != true ]; then echo "$interval not due -- skipped"; continue; fi
            curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/$interval?output_size=5" || { echo "::warning::/ingest/$interval failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
          done
      - name: Ingest 1h candles
        if: env.DUE_1H == 'true'
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/1h?output_size=5" || { echo "::warning::/ingest/1h failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
      - name: Ingest 4h candles
        if: env.DUE_4H == 'true'
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/4h?output_size=5" || { echo "::warning::/ingest/4h failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
      - name: Ingest 1day candles
        if: env.DUE_1DAY == 'true'
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/1day?output_size=5" || { echo "::warning::/ingest/1day failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
      # Consensus (app/services/consensus.py, SMC) is the only live signal source now --
      # the rule engine's own generate-signal step (POST /signals/.../intraday) was removed
      # along with the rest of that engine, see PROGRESS.md's rule-engine-removal entry.
      # Checked on the same per-interval cadence as ingest above, reusing the candles that
      # step already ingested (zero extra Twelve Data calls). Only fires a stored signal on
      # genuine weighted-majority agreement (see consensus.py's REQUIRED_WEIGHT_FRACTION),
      # so most of these calls are expected to return "no consensus" -- that's normal, not a
      # sign anything's broken.
      - name: Check consensus (5min, 15min)
        if: env.DUE_5MIN == 'true' || env.DUE_15MIN == 'true'
        run: |
          for interval in 5min 15min; do
            v=DUE_${interval^^}; if [ "${!v}" != true ]; then echo "$interval not due -- skipped"; continue; fi
            for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
              curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
                "$API_BASE/consensus/$interval?pair=${pair/\//%2F}" || { echo "::warning::/consensus/$interval ($pair) failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
            done
          done
      - name: Check consensus (1h)
        if: env.DUE_1H == 'true'
        run: |
          for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
            curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
              "$API_BASE/consensus/1h?pair=${pair/\//%2F}" || { echo "::warning::/consensus/1h ($pair) failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
          done
      - name: Check consensus (4h)
        if: env.DUE_4H == 'true'
        run: |
          for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
            curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
              "$API_BASE/consensus/4h?pair=${pair/\//%2F}" || { echo "::warning::/consensus/4h ($pair) failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
          done
      - name: Check consensus (1day)
        if: env.DUE_1DAY == 'true'
        run: |
          for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
            curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
              "$API_BASE/consensus/1day?pair=${pair/\//%2F}" || { echo "::warning::/consensus/1day ($pair) failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
          done
      - name: Score pending consensus signals
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/consensus/score" || { echo "::warning::/consensus/score failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
      # Retrains the supervised hit/miss classifier (app/services/ml_model.py) on every
      # resolved live signal -- right after scoring above, so it sees whatever just got
      # resolved this cycle. Unconditional/every firing like scoring, not gated by interval:
      # retraining costs no Twelve Data quota and is cheap (single-digit ms on ~238 rows), so
      # there's no reason to run it less often than the data it depends on actually changes.
      - name: Retrain ML model
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ml/train" || { echo "::warning::/ml/train failed"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV"; }
      # RL agent (app/services/rl_engine.py) -- a learned, adaptive alternative to consensus's
      # fixed weighted-vote threshold over the same 5 SMC strategies. Covers all 5 intervals, one
      # independent policy per pair PER interval. Training itself no longer happens here --
      # see .github/workflows/train-rl.yml and PROGRESS.md's 2026-09-10 entry: looping 20
      # sequential ~60-90s synchronous /rl/train calls from this workflow already produced a
      # documented 524, so training moved to its own workflow that runs the actual PPO code
      # directly on the runner instead of relaying through the API. Generate + score below
      # still follow each interval's own natural cadence (same split already used for
      # ingest/generate/consensus above) since that part is cheap -- a handful of strategy
      # evaluations on the latest candle against whatever policy train-rl.yml last produced,
      # not a training run. Paper-trade execution was removed entirely (Deriv isn't available
      # in every region) -- RL signals are sized (lot size) and traded manually instead, see
      # the RL page.
      # -f is deliberately dropped (replaced with a plain -s + `|| true` per call) on these
      # four steps only: unlike ingest/score, a 400 "no trained policy yet" here is an
      # expected, self-resolving state -- e.g. right after this cron first started running
      # against a pair/interval that hasn't hit its once-daily training slot yet, or after a
      # completely new pair/interval is added before its first training run. That isn't a
      # real failure worth turning the whole job red for; it just means "check again after
      # today's training step has run."
      - name: Generate RL signals (5min, 15min)
        if: env.DUE_5MIN == 'true' || env.DUE_15MIN == 'true'
        run: |
          for interval in 5min 15min; do
            v=DUE_${interval^^}; if [ "${!v}" != true ]; then echo "$interval not due -- skipped"; continue; fi
            for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
              for attempt in 1 2 3; do
                resp=$(curl -s -m 150 -w '\n%{http_code}' -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
                  "$API_BASE/rl/signal/$interval?pair=${pair/\//%2F}" || true)
                case "${resp##*$'\n'}" in 502|503|000) if [ "$attempt" -lt 3 ]; then echo "  (HTTP ${resp##*$'\n'}, backend restarting -- retry $attempt/2 in 40s)"; sleep 40; fi;; *) break;; esac
              done
              code=${resp##*$'\n'}
              echo "[$interval $pair] HTTP $code -- $(printf '%s' "${resp%$'\n'*}" | python3 -c "$RL_SUMMARIZE")"
              case "$code" in 5*|000) echo "::warning::/rl/signal/$interval ($pair) returned $code"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV";; esac
            done
          done
      - name: Generate RL signals (1h)
        if: env.DUE_1H == 'true'
        run: |
          for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
            for attempt in 1 2 3; do
              resp=$(curl -s -m 150 -w '\n%{http_code}' -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
                "$API_BASE/rl/signal/1h?pair=${pair/\//%2F}" || true)
              case "${resp##*$'\n'}" in 502|503|000) if [ "$attempt" -lt 3 ]; then echo "  (HTTP ${resp##*$'\n'}, backend restarting -- retry $attempt/2 in 40s)"; sleep 40; fi;; *) break;; esac
            done
            code=${resp##*$'\n'}
            echo "[1h $pair] HTTP $code -- $(printf '%s' "${resp%$'\n'*}" | python3 -c "$RL_SUMMARIZE")"
            case "$code" in 5*|000) echo "::warning::/rl/signal/1h ($pair) returned $code"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV";; esac
          done
      - name: Generate RL signals (4h)
        if: env.DUE_4H == 'true'
        run: |
          for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
            for attempt in 1 2 3; do
              resp=$(curl -s -m 150 -w '\n%{http_code}' -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
                "$API_BASE/rl/signal/4h?pair=${pair/\//%2F}" || true)
              case "${resp##*$'\n'}" in 502|503|000) if [ "$attempt" -lt 3 ]; then echo "  (HTTP ${resp##*$'\n'}, backend restarting -- retry $attempt/2 in 40s)"; sleep 40; fi;; *) break;; esac
            done
            code=${resp##*$'\n'}
            echo "[4h $pair] HTTP $code -- $(printf '%s' "${resp%$'\n'*}" | python3 -c "$RL_SUMMARIZE")"
            case "$code" in 5*|000) echo "::warning::/rl/signal/4h ($pair) returned $code"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV";; esac
          done
      - name: Generate RL signals (1day)
        if: env.DUE_1DAY == 'true'
        run: |
          for pair in "EUR/USD" "GBP/USD" "USD/JPY" "AUD/USD"; do
            for attempt in 1 2 3; do
              resp=$(curl -s -m 150 -w '\n%{http_code}' -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" \
                "$API_BASE/rl/signal/1day?pair=${pair/\//%2F}" || true)
              case "${resp##*$'\n'}" in 502|503|000) if [ "$attempt" -lt 3 ]; then echo "  (HTTP ${resp##*$'\n'}, backend restarting -- retry $attempt/2 in 40s)"; sleep 40; fi;; *) break;; esac
            done
            code=${resp##*$'\n'}
            echo "[1day $pair] HTTP $code -- $(printf '%s' "${resp%$'\n'*}" | python3 -c "$RL_SUMMARIZE")"
            case "$code" in 5*|000) echo "::warning::/rl/signal/1day ($pair) returned $code"; echo "SOFT_FAILURES=1" >> "$GITHUB_ENV";; esac
          done
      - name: Score pending RL signals
        # || true, matching every "Generate RL signals" step above -- this call works fine in
        # isolation (confirmed live 2026-09-21, ~6s) but was the sole reason this job showed
        # "failure" on every recent run: it occasionally exceeds FastAPI Cloud's own gateway
        # timeout under real cron load (right after the CPU-heavy signal-generation steps
        # above it), and unlike its siblings had no tolerance for that. Nothing is lost when
        # this one cycle's score attempt fails -- score_pending_rl_signals just re-checks the
        # same pending signals against real candles next cycle, same as always.
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/rl/score" || echo "::warning::/rl/score failed (non-blocking, retried next cycle)"
      # Every ingest/consensus/ML call above (and any 5xx/timeout from /rl/signal -- a 4xx
      # there, e.g. "no trained policy yet", is an expected state, not a failure) is soft-failing (|| records SOFT_FAILURES) so one
      # slow or failed upstream call -- e.g. Twelve Data dropping the connection for one pair,
      # or FastAPI Cloud's gateway timing out one request -- no longer aborts the whole job
      # before the signal-generation steps below it get to run on the candles already stored.
      # This step keeps those failures visible by still turning the run red at the very end.
      - name: Fail if any step above soft-failed
        if: env.SOFT_FAILURES == '1'
        run: |
          echo "::error::One or more ingest/consensus/ML/RL calls failed -- see the warnings above."
          exit 1
