name: Keep candle data fresh

# Replaces the in-process APScheduler job that used to run inside the FastAPI Cloud
# app (see app/main.py history). That approach silently stopped working whenever the
# instance scaled to zero between requests — the scheduler dies with the process and
# only resumes on the next cold start, so candle data could go stale for days without
# any error being raised. Driving ingestion from here instead means it runs on a
# schedule GitHub controls, independent of whether the backend instance is asleep.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://forex-assistant.fastapicloud.dev
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      # Every route except / and /auth/login requires auth (see app/core/auth.py). This
      # workflow can't do an interactive login, so it authenticates with a static
      # X-Service-Token instead of a user JWT — same value must be set as AUTH_SECRET_KEY2
      # on FastAPI Cloud (named to match what's already there, not related to the JWT
      # signing key AUTH_SECRET_KEY despite the similar name). The secret is named
      # AUTOMATION_TOKEN here on the GitHub side; only the value has to match, not the name.
      - name: Ingest 15min candles
        run: curl -sf -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/15min?output_size=5"
      - name: Ingest 1h candles
        run: curl -sf -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/1h?output_size=5"
      - name: Score pending live signals
        run: curl -sf -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/signals/score"
