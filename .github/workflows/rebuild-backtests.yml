name: Rebuild intraday backtests (ML training data)

# Regenerates SMC consensus backtest signals against the full historical archive using
# TODAY's live default_config_for("intraday") -- see scripts/rebuild_backtests.py's own
# docstring for why this has to run here instead of via POST /consensus/backtest per combo:
# a deep-archive backtest on 5min/15min replays hundreds of thousands of candles, and
# FastAPI Cloud's ~125s gateway timeout has already caused documented failures on similarly
# slow endpoints. No per-request timeout here at all.
#
# Also the actual fix for app/services/ml_training_data.py having nothing usable to draw on:
# checked live on 2026-09-12, every backtest run that existed before this workflow did
# predates the 2026-09-07 EMA 9/21 default and so wasn't usable. Run this manually now, and
# again any time PROFILE_DEFAULTS["intraday"] changes -- it's dispatch-only (not scheduled),
# since the default config changes rarely, not daily.
#
# Per-signal detail is written to data/backtest_signals_archive/*.parquet and committed to
# git, NOT to Mongo -- see scripts/rebuild_backtests.py's own docstring and PROGRESS.md's
# 2026-09-12 outage entry: writing ~90,000+ signals into backtest_signals_collection pushed
# Atlas over its 512MB M0 quota and crashed the entire app. Committing here triggers FastAPI
# Cloud's own git-triggered redeploy, same as data/candles/*.parquet already does -- the
# "Retrain ML model" step below may occasionally race a redeploy still in progress and read
# the previous archive; harmless, since keep-fresh.yml's own cron retrains again regularly
# anyway.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "backtest_rebuild_jobs_collection job id to report progress into (POST /backtest/rebuild-all passes this; a manual run can leave it blank)."
        required: false
      pair:
        description: "Single pair, e.g. EUR/USD. Leave blank (with interval) to backtest every pair x interval."
        required: false
      interval:
        description: "Single interval, e.g. 15min. Leave blank (with pair) to backtest every pair x interval."
        required: false
      max_lookforward:
        description: "Max candles to wait for target/stop before calling a signal expired."
        required: false
        default: "20"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      FOREX_PAIRS: ${{ secrets.FOREX_PAIRS }}
      # Same API_BASE/AUTOMATION_TOKEN keep-fresh.yml already uses for its own "Retrain ML
      # model" step (X-Service-Token auth, see app/core/auth.py) -- reused here so the fresh
      # archive this job just committed gets picked up in the same run, rather than waiting
      # for keep-fresh.yml's own cron cycle to notice it.
      API_BASE: https://forex-assistant.fastapicloud.dev
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild backtests
        env:
          JOB_ID: ${{ inputs.job_id }}
          PAIR: ${{ inputs.pair }}
          INTERVAL: ${{ inputs.interval }}
          MAX_LOOKFORWARD: ${{ inputs.max_lookforward || '20' }}
        run: |
          args=(--max-lookforward "$MAX_LOOKFORWARD")
          if [ -n "$JOB_ID" ]; then args+=(--job-id "$JOB_ID"); fi
          if [ -n "$PAIR" ] && [ -n "$INTERVAL" ]; then args+=(--pair "$PAIR" --interval "$INTERVAL"); fi
          python scripts/rebuild_backtests.py "${args[@]}"
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_signals_archive/
          if git diff --cached --quiet; then
            echo "No changes to the archive."
          else
            git commit -m "Update backtest signals archive ($(date -u +%Y-%m-%d))"
            git push
          fi
      # force=true because the resolved-signal COUNT can be unchanged from the last run while
      # the underlying rows are entirely different (fresh qualifying backtest signals
      # replacing what were previously all non-qualifying) -- see /ml/train's own docstring
      # for why it otherwise skips a same-count refit.
      #
      # if: always() -- rebuild_backtests.py exits 1 if even ONE pair/interval combo failed
      # (e.g. a transient Atlas connection drop on a single slow 5min combo, seen live
      # 2026-09-12: 18/20 combos still succeeded and wrote real data). Without this, GitHub
      # Actions marks the "Rebuild backtests" step failed and skips every step after it --
      # silently losing the retrain even though plenty of fresh qualifying data just landed.
      # Per-combo failures are already visible in the job doc's own results table
      # (GET /backtest/rebuild-all/{job_id}), so failing loud here would be redundant, not
      # informative -- this step should run on any outcome short of the job being cancelled.
      - name: Retrain ML model
        if: always()
        run: |
          curl -sf -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ml/train?force=true"
