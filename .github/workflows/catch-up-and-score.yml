name: Catch up candles, score signals, retrain ML

# Manual only. For when keep-fresh.yml has been failing or GitHub's scheduler has gone quiet
# long enough that candles have gaps: open signals can't resolve against candles that were
# never ingested, and anything trained afterwards learns from those gaps. In order:
#   1. POST /ingest/{interval} for every interval (each call fills the gap since the last
#      stored candle -- see that step's comment)
#   2. score pending consensus + RL signals against the now-complete candles
#   3. POST /ml/train?force=true -- forced so it refits even when the row count is unchanged
# PPO retraining is separate (train-rl.yml) -- dispatch it after this finishes.
#
# Don't run this at the same time as backfill-history.yml -- both hit Twelve Data's shared
# per-minute limit.
on:
  workflow_dispatch: {}

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_BASE: https://forex-assistant.fastapicloud.dev
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      # Per-interval /ingest, not POST /ingest/catch-up: that endpoint runs as an in-process
      # background job, and on its first live use (2026-09-28) it sat at 0/20 combos until
      # the replica restarted and the job was orphaned. /ingest is synchronous and already
      # auto-widens to fill any gap since the last stored candle (up to
      # data_fetcher.MAX_AUTO_BACKFILL_CANDLES = 1000 candles, ~3.5 days at 5min), which
      # covers a weekend plus a few failed keep-fresh cycles. Retried on 5xx/timeouts.
      - name: Catch up candles (all intervals)
        run: |
          failed=0
          for interval in 5min 15min 1h 4h 1day; do
            for attempt in 1 2 3; do
              if out=$(curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ingest/$interval?output_size=5"); then
                echo "$interval: $out"; break
              fi
              echo "  $interval attempt $attempt failed"
              if [ "$attempt" -eq 3 ]; then failed=1; else sleep 40; fi
            done
            # Per-pair errors come back inside a 200 ({"AUD/USD": "error: ..."}), so check the body too.
            if echo "$out" | grep -q '"error'; then echo "::warning::$interval had a per-pair ingest error"; failed=1; fi
          done
          if [ "$failed" = 1 ]; then echo "::error::candle catch-up incomplete -- see above"; exit 1; fi
      - name: Score pending consensus signals
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/consensus/score"
      - name: Score pending RL signals
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/rl/score"
      - name: Retrain ML model
        run: |
          curl -sf -m 150 -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/ml/train?force=true"
