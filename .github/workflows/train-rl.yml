name: Train RL policy (PPO)

# Runs PPO training directly on this runner instead of inside the FastAPI Cloud process --
# see PROGRESS.md's 2026-09-10 entry. keep-fresh.yml used to drive this by looping curl
# calls against the synchronous POST /rl/train/{interval} for all 20 pair/interval combos
# (60-90s each), which already produced a documented 524 from FastAPI Cloud's gateway.
# scripts/train_rl.py reuses the exact same training/persistence code that endpoint calls,
# just run here where a 20-30 minute job is normal, not something fighting a ~60s request
# timeout or an in-process background task that might not survive an instance recycle.
#
# Schedule matches keep-fresh.yml's old once-daily RL slot (11 0 * * *, i.e. right after
# that workflow's own daily 1day-candle ingest) -- a policy doesn't need to be as fresh as
# the candles it reads, see keep-fresh.yml's own RL step comment for why once a day is
# plenty even for 5min/15min policies.
#
# Matrix, not a single sequential job (changed 2026-09-20, see PROGRESS.md): the Phase 2
# learned-exit architecture steps bar-by-bar during both training and evaluation instead of
# jumping straight to a trade's resolution (see rl_engine.py/ppo_engine.py), which made a
# single job walking all 20 combos in a for-loop meaningfully slower per combo than before --
# confirmed live: the last two nightly schedule-triggered runs (2026-09-19, 2026-09-20) each
# ran 2+ hours and were cancelled without finishing. generate-matrix below fans every trigger
# (schedule, workflow_dispatch with no pair/interval e.g. POST /rl/train-all, or a manual
# full-sweep dispatch) out into 20 independent train jobs, one per pair/interval, each with
# its own 6-hour timeout and running in parallel -- the exact fix already proven live earlier
# 2026-09-20 by manually dispatching the 20 combos as separate workflow_dispatch calls
# instead of one sweep. A workflow_dispatch WITH both pair and interval given (a single-combo
# retry, e.g. from POST /rl/train/{interval}) still runs as just that one job, unchanged.
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "rl_train_jobs_collection job id to report progress into (POST /rl/train-all passes this; a manual run can leave it blank)."
        required: false
      pair:
        description: "Single pair, e.g. EUR/USD. Leave blank (with interval) to train every pair x interval."
        required: false
      interval:
        description: "Single interval, e.g. 5min. Leave blank (with pair) to train every pair x interval."
        required: false
      total_timesteps:
        description: "PPO total_timesteps per combo."
        required: false
        default: "50000"
      train_frac:
        description: "Chronological train/test split fraction."
        required: false
        default: "0.7"
      starting_balance:
        description: "Starting account balance for the compounding-reward eval."
        required: false
        default: "50"
      target_atr_mult:
        description: "Override rl_atr_mults(interval, pair)'s target ATR multiple -- leave blank (with stop_atr_mult) to use the configured default. Must be given with stop_atr_mult and a single pair/interval combo, see main.py's POST /rl/train/{interval} for the same override."
        required: false
      stop_atr_mult:
        description: "Override rl_atr_mults(interval, pair)'s stop ATR multiple -- see target_atr_mult."
        required: false

jobs:
  # Decides the matrix -- one combo (from workflow_dispatch's own pair/interval inputs) or
  # every pair x interval (schedule, or a workflow_dispatch left blank on purpose). Pure
  # bash/python3 (both preinstalled on ubuntu-latest), no checkout/pip install needed just to
  # answer this, so it adds only a few seconds ahead of the real work.
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.set.outputs.combos }}
    env:
      FOREX_PAIRS: ${{ secrets.FOREX_PAIRS }}
      PAIR: ${{ inputs.pair }}
      INTERVAL: ${{ inputs.interval }}
    steps:
      - id: set
        run: |
          if [ -n "$PAIR" ] && [ -n "$INTERVAL" ]; then
            echo "combos=[{\"pair\":\"$PAIR\",\"interval\":\"$INTERVAL\"}]" >> "$GITHUB_OUTPUT"
          else
            python3 -c "
          import json, os
          pairs = [p.strip() for p in os.environ.get('FOREX_PAIRS', 'EUR/USD,GBP/USD,USD/JPY,AUD/USD').split(',')]
          intervals = ['5min', '15min', '1h', '4h', '1day']
          combos = [{'pair': p, 'interval': i} for p in pairs for i in intervals]
          print('combos=' + json.dumps(combos))
          " >> "$GITHUB_OUTPUT"
          fi

  train:
    needs: generate-matrix
    runs-on: ubuntu-latest
    # fail-fast: false -- one combo's training blowing up (bad data, a transient Mongo
    # hiccup) shouldn't cancel the other 19 already in flight, the same tolerance every
    # per-combo try/except in scripts/train_rl.py's own sweep loop already had. No
    # max-parallel cap -- let GitHub queue past whatever the account's concurrent-job limit
    # is rather than second-guessing that number here; keep-fresh.yml's own runs queue the
    # same way if they overlap.
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJson(needs.generate-matrix.outputs.combos) }}
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      FOREX_PAIRS: ${{ secrets.FOREX_PAIRS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train
        env:
          JOB_ID: ${{ inputs.job_id }}
          PAIR: ${{ matrix.combo.pair }}
          INTERVAL: ${{ matrix.combo.interval }}
          TOTAL_TIMESTEPS: ${{ inputs.total_timesteps || '50000' }}
          TRAIN_FRAC: ${{ inputs.train_frac || '0.7' }}
          STARTING_BALANCE: ${{ inputs.starting_balance || '50' }}
          TARGET_ATR_MULT: ${{ inputs.target_atr_mult }}
          STOP_ATR_MULT: ${{ inputs.stop_atr_mult }}
        run: |
          args=(--pair "$PAIR" --interval "$INTERVAL" --total-timesteps "$TOTAL_TIMESTEPS" --train-frac "$TRAIN_FRAC" --starting-balance "$STARTING_BALANCE")
          if [ -n "$JOB_ID" ]; then args+=(--job-id "$JOB_ID"); fi
          if [ -n "$TARGET_ATR_MULT" ] && [ -n "$STOP_ATR_MULT" ]; then
            args+=(--target-atr-mult "$TARGET_ATR_MULT" --stop-atr-mult "$STOP_ATR_MULT")
          fi
          python scripts/train_rl.py "${args[@]}"

  # Split out of the train job (was its last step, "if: always()") now that train runs 20x
  # in parallel -- running this once per matrix entry would mean 20 redundant calls instead
  # of one. needs: train + if: always() so a prune still happens even if some combos failed,
  # same reasoning rebuild-backtests.yml's own chained retrain already documents.
  prune:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    env:
      API_BASE: https://forex-assistant.fastapicloud.dev
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      - name: Prune RL history
        run: |
          curl -sf -X POST -H "X-Service-Token: $AUTOMATION_TOKEN" "$API_BASE/rl/prune-history?confirm=true"
